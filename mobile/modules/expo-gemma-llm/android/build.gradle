apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.gemmallm'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  namespace 'expo.modules.gemmallm'
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // 0.10.35+ adds LiteRT-LM (.litertlm) model format support for Gemma-3n
  implementation 'com.google.mediapipe:tasks-genai:0.10.35'
  // provides com.google.mediapipe.framework.image.MPImage + BitmapImageBuilder for multimodal input
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
