[project]
name = "nosignal-cloud"
version = "0.1.0"
description = "FieldFix cloud pipeline: research, validation, distillation into fault-tree entries."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "google-genai>=0.3",
    "google-cloud-storage>=2.14.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "cloud",
    "cloud.agents",
    "cloud.agents.research",
    "cloud.agents.validation",
    "cloud.agents.distillation",
    "cloud.fleet_store",
    "cloud.media",
    "cloud.api",
]
package-dir = {"cloud" = "."}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
