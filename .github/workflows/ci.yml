name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cloud-tests:
    name: cloud pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/pyproject.toml
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest tests

  fault-tree-validate:
    name: fault-tree schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install check-jsonschema
        run: pip install check-jsonschema
      - name: list fault trees
        id: list
        run: |
          set -e
          shopt -s nullglob
          files=$(find fault_trees -maxdepth 1 -type f -name '*.json' ! -name 'schema.json' | sort)
          if [ -z "$files" ]; then
            echo "no fault-tree files found" >&2
            exit 1
          fi
          echo "$files"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: validate
        run: |
          check-jsonschema \
            --schemafile fault_trees/schema.json \
            ${{ steps.list.outputs.files }}

  mobile-lint:
    name: mobile lint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint (if configured)
        run: npm run lint --if-present
      - name: tsc --noEmit
        run: npx tsc --noEmit
